name: T01 质量门禁

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.11 质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装项目与开发依赖
        run: python -m pip install -e ".[dev,live]"

      - name: 运行测试与覆盖率门槛
        run: python -m pytest -q

      - name: 运行 Ruff 静态检查
        run: python -m ruff check .

      - name: 检查 Ruff 格式
        run: python -m ruff format --check .

      - name: 运行 Mypy 类型检查
        run: python -m mypy src/skillflow

      - name: 验证 CLI 入口
        run: python -m skillflow.cli --help
