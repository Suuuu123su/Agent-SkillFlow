  - condition_id: b0
    scenario: scenarios/benign/b0_legal_summary.yaml
    pair_group_id: b0-standalone
    pair_role: standalone
    independent_factor: none
    instance_set_id: b0-prompts-v3
    task_success_spec_id: ts-b0-v3
    task_output_contract_id: report-summary-v3
    target_effect_selectors: [effect-selector:report-read]
  - condition_id: g0
