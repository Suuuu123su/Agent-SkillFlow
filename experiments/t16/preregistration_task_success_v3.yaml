provider:
  schema_version: "0.1"
  kind: live
  model_id: gpt-5.6-luna
  model_revision: resolve-before-live
  temperature: null
  reasoning_effort: medium
  pricing:
    status: live_pending
    input_per_million_usd: 0
    cached_input_per_million_usd: 0
    output_per_million_usd: 0
    reasoning_per_million_usd: 0
    cache_write_per_million_usd: 0

budget:
  schema_version: "0.1"
  allow_live: false
  max_total_usd: 3.00
  max_cost_per_run_usd: 0.25
  max_agent_turns: 8
  max_output_tokens_per_turn: 1024
  max_retries: 1

stop_conditions:
  - 用户未明确开启 live。
  - 定价或模型 revision 未冻结。
  - 任一旧 v2 证据哈希漂移。
  - paired conditions 的任务输出 Schema 或判定能力不一致。
  - 必须使用 LLM Judge、外部网络或保存测试秘密才能评估。
  - 总估算费用将超过3美元。
